<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Manager</title><style>
:root{--ink:#161616;--paper:#f4f3ef;--line:#c9c8c3;--muted:#6c6b67}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 Arial,"Microsoft YaHei",sans-serif}.bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--ink);background:var(--paper)}.brand{font-weight:700;letter-spacing:.05em}.bar-actions{display:flex;gap:8px;margin-left:auto}button,.button{border:1px solid var(--ink);border-radius:0;background:transparent;padding:8px 11px;color:inherit;font:inherit;cursor:pointer}button:hover,.button:hover{background:var(--ink);color:white}.publish{background:var(--ink);color:white}.app{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 57px)}aside{border-right:1px solid var(--ink);padding:18px}.new{width:100%;margin-bottom:18px}.project-list{display:grid;gap:0}.project-list button{border-width:0 0 1px;text-align:left;padding:13px 0}.project-list button.active{font-weight:700}.project-list small{display:block;margin-top:3px;color:var(--muted)}main{max-width:1040px;padding:34px 40px 90px}.empty{padding:80px 0;color:var(--muted)}.form-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-bottom:1px solid var(--ink);padding-bottom:18px}.form-head h1{margin:0;font-size:32px;letter-spacing:-.05em}.status{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:28px 0}.field{display:grid;gap:7px}.field.wide{grid-column:1/-1}label{font-size:12px;font-weight:700}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:0;background:#fff;padding:10px;font:inherit}textarea{min-height:104px;resize:vertical}.section-title{grid-column:1/-1;margin:20px 0 0;border-bottom:1px solid var(--line);padding-bottom:7px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.hint{margin:0;color:var(--muted);font-size:12px}.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}.media-item{position:relative;border:1px solid var(--line);background:#fff}.media-item img{display:block;width:100%;height:96px;object-fit:cover}.media-item label{display:block;padding:8px;font-weight:400}.form-actions{display:flex;gap:10px;align-items:center;padding-top:25px;border-top:1px solid var(--ink)}.danger{border-color:#a40000;color:#a40000}.toast{position:fixed;right:20px;bottom:20px;max-width:360px;padding:12px 14px;background:var(--ink);color:white;opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}.cv{margin-top:60px;padding-top:20px;border-top:1px solid var(--ink)}@media(max-width:760px){.app{display:block}aside{border-right:0;border-bottom:1px solid var(--ink)}main{padding:24px 18px 70px}.grid{grid-template-columns:1fr}.bar{flex-wrap:wrap}.bar-actions{width:100%;margin-left:0}.form-head{display:block}.form-head .status{margin-top:8px}}
</style></head><body><header class="bar"><span class="brand">PORTFOLIO MANAGER</span><span id="status" class="status">Loading…</span><div class="bar-actions"><a class="button" href="/site/" target="_blank">预览网站</a><button id="build">生成预览</button><button id="publish" class="publish">发布到 GitHub</button></div></header><div class="app"><aside><button id="new" class="new">＋ 新建项目</button><div id="project-list" class="project-list"></div></aside><main id="workspace"><div class="empty">选择一个项目开始编辑，或新建项目。</div></main></div><div id="toast" class="toast"></div><script>
const state={projects:[],current:null};const $=s=>document.querySelector(s);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const note=(text,bad=false)=>{const n=$('#toast');n.textContent=text;n.style.background=bad?'#9b1c1c':'#161616';n.classList.add('show');setTimeout(()=>n.classList.remove('show'),3800)};const request=async(url,options={})=>{const r=await fetch(url,{headers:{'content-type':'application/json'},...options});const d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');return d};const readFile=(file)=>new Promise((ok,no)=>{if(!file)return ok(null);const r=new FileReader();r.onload=()=>ok({name:file.name,dataUrl:r.result});r.onerror=no;r.readAsDataURL(file)});
function list(){const list=$('#project-list');list.innerHTML=state.projects.slice().sort((a,b)=>(b.sortDate||'').localeCompare(a.sortDate||'')).map(p=>`<button data-slug="${esc(p.slug)}" class="${state.current?.slug===p.slug?'active':''}">${esc(p.title.zh||p.slug)}<small>${esc(p.year||'年份待确认')} · ${esc(p.type.zh||'')}</small></button>`).join('');list.querySelectorAll('button').forEach(b=>b.onclick=()=>openProject(state.projects.find(p=>p.slug===b.dataset.slug)))}
const input=(name,label,value='',type='text',wide=false)=>`<div class="field ${wide?'wide':''}"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}"></div>`;const area=(name,label,value='',wide=true)=>`<div class="field ${wide?'wide':''}"><label>${label}</label><textarea name="${name}">${esc(value)}</textarea></div>`;
function openProject(project){state.current=project;list();const isNew=!project.originalSlug;const g=(project.gallery||[]).map(path=>`<div class="media-item"><img src="/site/${encodeURI(path)}" alt=""><label><input type="checkbox" name="galleryKeep" value="${esc(path)}" checked> 保留</label></div>`).join('');$('#workspace').innerHTML=`<form id="form"><div class="form-head"><h1>${isNew?'新建项目':esc(project.title.zh||project.slug)}</h1><span class="status">所有内容保存于 content/projects.json</span></div><div class="grid"><p class="section-title">基础信息</p>${input('slug','英文 URL 标识（例如 another-sky）',project.slug)}${input('sortDate','排序日期（YYYY-MM-DD）',project.sortDate,'date')}${input('year','显示年份',project.year)}<div class="field"><label>状态</label><select name="status"><option value="public" ${project.status!=='draft'?'selected':''}>公开</option><option value="draft" ${project.status==='draft'?'selected':''}>草稿（不显示在网站）</option></select></div><p class="section-title">中文内容</p>${input('titleZh','项目名称（中文）',project.title?.zh)}${input('typeZh','项目类型（中文）',project.type?.zh)}${area('summaryZh','简介（中文）',project.summary?.zh)}${input('roleZh','职责（中文，可留空）',project.role?.zh)}${input('clientZh','合作方 / 客户（中文，可留空）',project.client?.zh)}<p class="section-title">English content</p>${input('titleEn','Project title (English)',project.title?.en)}${input('typeEn','Project type (English)',project.type?.en)}${area('summaryEn','Summary (English)',project.summary?.en)}${input('roleEn','Role (English, optional)',project.role?.en)}${input('clientEn','Client (English, optional)',project.client?.en)}${input('tags','Tags（用逗号分隔）',(project.tags||[]).join(', '), 'text',true)}${input('tools','Tools（用逗号分隔，可留空）',(project.tools||[]).join(', '), 'text',true)}<p class="section-title">图片</p><div class="field wide"><label>封面图片（选新文件即替换）</label><input name="cover" type="file" accept="image/*"><p class="hint">未上传封面时，作品索引会显示为纯文字项目条目，不会生成空白卡片。</p>${project.cover?`<div class="media-grid"><div class="media-item"><img src="/site/${encodeURI(project.cover)}" alt="封面"><label><input type="checkbox" name="removeCover"> 删除封面</label></div></div>`:''}</div><div class="field wide"><label>详情页图库（可多选；新选择的图片会追加）</label><input name="gallery" type="file" accept="image/*" multiple><div class="media-grid">${g||'<p class="hint">暂无详情图片。</p>'}</div></div></div><div class="form-actions"><button class="publish" type="submit">保存项目</button>${!isNew?'<button class="danger" id="delete" type="button">删除项目</button>':''}<span id="form-status" class="status"></span></div></form>`;$('#form').onsubmit=save;$('#delete')?.addEventListener('click',removeProject)}
async function save(event){event.preventDefault();const f=event.currentTarget;const cover=await readFile(f.cover.files[0]);const galleryNew=await Promise.all([...f.gallery.files].map(readFile));const data={originalSlug:state.current.originalSlug||'',slug:f.slug.value,status:f.status.value,sortDate:f.sortDate.value,year:f.year.value,title:{zh:f.titleZh.value,en:f.titleEn.value},type:{zh:f.typeZh.value,en:f.typeEn.value},summary:{zh:f.summaryZh.value,en:f.summaryEn.value},role:{zh:f.roleZh.value,en:f.roleEn.value},client:{zh:f.clientZh.value,en:f.clientEn.value},tags:f.tags.value.split(',').map(x=>x.trim()).filter(Boolean),tools:f.tools.value.split(',').map(x=>x.trim()).filter(Boolean),removeCover:f.removeCover?.checked||false,coverNew:cover,galleryNew,galleryKeep:[...f.querySelectorAll('[name=galleryKeep]:checked')].map(x=>x.value)};$('#form-status').textContent='保存中…';try{const result=await request('/api/projects',{method:'POST',body:JSON.stringify(data)});const i=state.projects.findIndex(p=>p.slug===state.current.originalSlug);if(i>=0)state.projects[i]=result.project;else state.projects.push(result.project);result.project.originalSlug=result.project.slug;openProject(result.project);note('项目已保存。点击“生成预览”或“发布到 GitHub”更新网站。')}catch(e){note(e.message,true)}finally{$('#form-status')&&( $('#form-status').textContent='')}}
async function removeProject(){if(!confirm(`删除“${state.current.title.zh}”及其已上传图片？此操作不可恢复。`))return;try{await request('/api/projects/'+encodeURIComponent(state.current.slug),{method:'DELETE'});state.projects=state.projects.filter(p=>p.slug!==state.current.slug);state.current=null;list();$('#workspace').innerHTML='<div class="empty">项目已删除。</div>';note('项目已删除。')}catch(e){note(e.message,true)}}
function newProject(){openProject({originalSlug:'',slug:'',status:'draft',sortDate:'',year:'',title:{zh:'',en:''},type:{zh:'',en:''},summary:{zh:'',en:''},role:{zh:'',en:''},client:{zh:'',en:''},tools:[],tags:[],cover:'',gallery:[]})}
async function action(path,label){$('#status').textContent=label+'…';try{const r=await request(path,{method:'POST',body:JSON.stringify({message:'Update portfolio content'})});note(label+'完成。'+(r.output||''));}catch(e){note(e.message,true)}finally{$('#status').textContent=''}}
$('#new').onclick=newProject;$('#build').onclick=()=>action('/api/build','生成预览');$('#publish').onclick=()=>action('/api/publish','发布');(async()=>{try{state.projects=await request('/api/projects');state.projects.forEach(p=>p.originalSlug=p.slug);list();$('#status').textContent='';if(state.projects[0])openProject(state.projects[0])}catch(e){note(e.message,true)}})();
</script></body></html>
